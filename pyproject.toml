[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skin-lesion-foundation"
version = "0.1.0"
description = "Phase 1 foundation for ISIC 2018 lesion detection and segmentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
    "Pillow>=10.2,<13",
    "PyYAML>=6.0.1,<7",
    "streamlit>=1.49,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["src*", "app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".tools", ".venv", "data", "checkpoints", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
